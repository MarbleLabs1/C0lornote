name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # O PyQt6 precisa destas bibliotecas mesmo rodando sem tela.
      - name: Instalar dependencias de sistema do Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-cursor0

      - name: Instalar dependencias do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Rodar os testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v

  build:
    name: Empacotamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Garante que o setup.py continua declarando o pacote corretamente:
      # o entry point c0lornote-gui do .desktop depende disso.
      - name: Verificar o pacote
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python - <<'EOF'
          import zipfile, glob, sys

          wheel = glob.glob("dist/*.whl")[0]
          nomes = zipfile.ZipFile(wheel).namelist()

          obrigatorios = [
              "src/main.py",
              "src/ui/main_window.py",
              "src/models/storage.py",
          ]
          faltando = [c for c in obrigatorios if c not in nomes]
          if faltando:
              print("Arquivos ausentes no wheel:", faltando)
              sys.exit(1)

          entry = [n for n in nomes if n.endswith("entry_points.txt")]
          if not entry:
              print("O wheel nao declara entry points")
              sys.exit(1)

          conteudo = zipfile.ZipFile(wheel).read(entry[0]).decode()
          if "src.main:main" not in conteudo:
              print("Entry point errado:\n" + conteudo)
              sys.exit(1)

          print(f"{wheel}: ok, {len(nomes)} arquivos")
          EOF
